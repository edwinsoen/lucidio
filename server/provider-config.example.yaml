# Copy to server/provider-config.local.yaml for local real provider use.
# Secret values are read from environment variables only; do not place secrets here.
# Seedream entries configure image generation; Seedance entries configure video generation.
# Video generation stores an MP4 plus the returned last-frame thumbnail in object storage.
# At least one provider (byteplus or gemini) must be configured; both may coexist.
# Gemini models (Nano Banana image, Veo/Omni Flash video) need no per-model endpoint mapping;
# the catalog model id is used directly as the API model name, and Gemini video thumbnails are
# extracted from the first frame server-side.
providers:
  gemini:
    baseUrl: https://generativelanguage.googleapis.com
    apiKeyEnv: GEMINI_API_KEY
  byteplus:
    modelArk:
      baseUrl: https://ark.ap-southeast.bytepluses.com
      apiKeyEnv: BYTEPLUS_MODELARK_API_KEY
      modelEndpointIds:
        dola-seedream-5-5-261028: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDREAM_5_5
        dola-seedream-5-0-pro-260628: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDREAM_5_PRO
        dola-seedream-5-0-flash-260915: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDREAM_5_FLASH
        seedream-5-0-lite-260128: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDREAM_5_LITE
        seedream-4-5-251128: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDREAM_4_5
        seedream-4-0-250828: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDREAM_4_0
        dreamina-seedance-2-0-260128: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDANCE_2
        dreamina-seedance-2-0-fast-260128: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDANCE_2_FAST
        dreamina-seedance-2-0-mini-260615: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDANCE_2_MINI
        dreamina-seedance-2-5-260628: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDANCE_2_5
        seedance-1-5-pro-251215: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDANCE_1_5_PRO
        seedance-1-0-pro-250528: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDANCE_1_0_PRO
        seedance-1-0-pro-fast-251015: BYTEPLUS_ACCOUNT_ENDPOINT_ID_FOR_SEEDANCE_1_0_PRO_FAST
storage:
  provider: byteplus-tos
  byteplusTos:
    endpoint: https://tos-s3-ap-southeast-1.bytepluses.com
    region: ap-southeast-1
    bucket: lucidio-generated-media
    accessKeyIdEnv: BYTEPLUS_TOS_ACCESS_KEY_ID
    secretAccessKeyEnv: BYTEPLUS_TOS_SECRET_ACCESS_KEY
    publicBaseUrl: ''
    keyPrefix: generations
    presignTtlSeconds: 900
