notes:
  - The base Seedream 5.0 ID seedream-5-0-260128 is excluded because it is no longer available in the target ModelArk model list as of 2026-10-04.
  - Older API-reference-only Seedream 3.0 and Seededit variants are intentionally excluded from this first catalog.
  - Gemini models carry provider gemini and use the catalog id directly as the API model name (no endpoint mapping). Nano Banana image and Omni Flash video use the Interactions API; Veo uses predictLongRunning + operation polling. Imagen (deprecated) and legacy gemini-2.5-flash-image are intentionally excluded.
  - Gemini video (Veo, Omni Flash) returns only an MP4; Lucidio extracts the first frame as the thumbnail server-side. Omni Flash is a public-preview model and its retrieval mechanics may change.
  - Dreamina Seedance 2.5 request parameter names/enums are carried over from the Seedance 2.0 schema (same task-based /api/v3/contents/generations/tasks endpoint) pending confirmation against BytePlus's API reference; capabilities (resolution, duration, aspect ratios, audio) are sourced from BytePlus's public console/marketing pages as of 2026-08-12.
  - Seedream 5.5, 5.0 Pro, and 5.0 Flash image-generation capabilities and sizes follow BytePlus's Dola Seedream tutorials reviewed on 2026-11-14. Layer decomposition is a separate API flow and is excluded from these single-output catalog entries. Seedream 5.5 and 5.0 Pro/Flash do not support sequential_image_generation; Seedream 5.5 additionally supports native RGBA background control (auto, transparent, opaque) requiring png output when transparent.
models:
  - id: dola-seedream-5-5-261028
    displayName: Seedream 5.5
    family: seedream
    modality: image
    endpoint: /api/v3/images/generations
    description: Next-generation BytePlus Dola Seedream 5.5 image creation and editing model with high multi-turn consistency, native RGBA transparent background generation, and rich multilingual text rendering.
    capabilities:
      tasks:
        - text-to-image
        - image-to-image
        - multi-reference-image-to-image
      resolutions: [1K, 1.5K, 2K]
      aspectRatios: [1:1, 16:9, 9:16, 4:3, 3:4, 3:2, 2:3, 21:9]
      outputFormats: [jpeg, png]
      responseFormats: [url, b64_json]
      maxReferenceImages: 10
      maxOutputImages: 1
    parameters:
      - { name: model, type: string, required: true, notes: BytePlus model ID or endpoint ID. }
      - { name: prompt, type: string, required: true, maxRecommendedWords: 600 }
      - { name: image, type: string_or_array, required: false, maxItems: 10, notes: URL or data URL reference images; supports single or multiple images. }
      - { name: size, type: string, required: false, enum: [1K, 1.5K, 2K], default: 2K, notes: May also be explicit WIDTHxHEIGHT within documented pixel/aspect constraints. }
      - { name: stream, type: boolean, required: false, default: false }
      - { name: output_format, type: string, required: false, enum: [png, jpeg], default: jpeg }
      - { name: background, type: string, required: false, enum: [auto, transparent, opaque], default: auto, notes: Transparent background requires output_format to be png. }
      - { name: response_format, type: string, required: false, enum: [url, b64_json], default: url }
      - { name: watermark, type: boolean, required: false, default: false }
      - { name: optimize_prompt_options.mode, type: string, required: false, enum: [standard, fast], default: standard }

